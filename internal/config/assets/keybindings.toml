# JotMD key bindings. Each value replaces the default keys for its action.

[bindings]
"tree.up" = ["k", "up"]
"tree.down" = ["j", "down"]
"tree.first" = ["home"]
"tree.last" = ["end"]
"tree.collapse" = ["h", "left"]
"tree.expand" = ["l", "right"]
"tree.parent" = ["backspace"]
"tree.open" = ["enter", "space"]
"note.edit" = ["e"]
"note.new" = ["n"]
"directory.new" = ["N"]
"note.rename" = ["r"]
"note.copy" = ["c"]
"note.move" = ["m"]
"note.trash" = ["d"]
"note.delete" = ["D"]
"app.focus" = ["tab"]
"app.reload" = ["R"]
"app.help" = ["?"]
"theme.select" = ["t"]
"search.open" = ["/"]
"app.palette" = [":"]
"preview.raw" = ["v"]
"preview.wrap" = ["w"]
"preview.style" = ["s"]
"view.agent_memory" = ["a"]
"app.quit" = ["q"]
"help.close" = ["esc"]
"theme.up" = ["up", "ctrl+p"]
"theme.down" = ["down", "ctrl+n"]
"theme.apply" = ["enter"]
"theme.close" = ["esc"]
